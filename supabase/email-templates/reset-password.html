<!-- Supabase → Authentication → Emails → "Reset Password".
     Subject: Your Dynamic Dazzle reset code
     The app asks for the code ({{ .Token }}). The button still works too: it opens the app's
     "Choose a new password" screen. -->
<div style="background:#140E0B;padding:32px 16px;font-family:Inter,Helvetica,Arial,sans-serif;color:#FBEFDC">
  <div style="max-width:420px;margin:0 auto;background:#1E1612;border-radius:20px;padding:28px 24px;border:1px solid #4A372B;text-align:center">
    <div style="font-family:Georgia,serif;font-size:26px;color:#FFF3DA">Dynamic <span style="color:#FFD36E">Dazzle</span></div>
    <p style="margin:18px 0 6px;font-size:16px">Here's your code to reset your password:</p>
    <div style="font-size:34px;letter-spacing:8px;font-weight:700;color:#FFD36E;margin:10px 0 18px">{{ .Token }}</div>
    <p style="margin:0 0 22px;font-size:14px;color:#C2B19B">Type it on the sign-in screen. It works once and expires in an hour.</p>
    <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#FFD36E;color:#2A1A0C;text-decoration:none;font-weight:600;padding:12px 22px;border-radius:999px">Or tap here to reset</a>
    <p style="margin:22px 0 0;font-size:12px;color:#A08D78">Didn't ask for this? You can ignore this email. Your password stays the same.</p>
  </div>
</div>
